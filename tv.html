<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AH TV Display</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#05091f;color:white;width:100vw;height:100vh;overflow:hidden}
.stage{width:100vw;height:100vh;background:radial-gradient(circle,#12195a,#05091f 75%);position:relative;padding:2vw}
.logo{position:absolute;top:2vw;right:3vw;color:#e8bb3f;font-size:3vw;font-weight:900}
.roundScore{position:absolute;top:4vh;left:50%;transform:translateX(-50%);width:9vw;height:9vw;border:.35vw solid #e8bb3f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4vw;font-weight:900;background:#050816}
.timer{position:absolute;top:7vh;right:24vw;font-size:3vw;font-weight:900}
.team{position:absolute;top:13vh;width:16vw;height:58vh;border:.25vw solid #6b2fa8;border-radius:2vw;background:rgba(48,20,84,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}
.left{left:3vw}.right{right:3vw}
.teamName{font-size:2vw;font-weight:900;margin-bottom:1vw}
.teamPoints{border:.25vw solid #e8bb3f;border-radius:1vw;width:11vw;height:5vw;display:flex;align-items:center;justify-content:center;font-size:3vw;font-weight:900;background:#050816}
.players,.current{margin-top:1vw;color:#cbd5e1;font-size:1.2vw}.current{color:#e8bb3f}
.wrongs{margin-top:1vw;font-size:2vw;color:#ef4444}
.board{position:absolute;top:23vh;left:50%;transform:translateX(-50%);width:58vw;height:48vh;border:.3vw solid #e8bb3f;border-radius:2vw;padding:1vw;display:grid;grid-template-columns:1fr 1fr;gap:1vw;background:rgba(0,0,0,.25)}
.answer{background:linear-gradient(145deg,#102b86,#172a78);border:.2vw solid #1e40af;border-radius:1.2vw;display:flex;align-items:center;justify-content:center;position:relative;font-size:2vw;font-weight:900;color:#9db7ff}
.num{position:absolute;right:1vw;width:2.5vw;height:2.5vw;border-radius:50%;background:#1d4ed8;display:flex;align-items:center;justify-content:center}
.answer.revealed{color:white;justify-content:space-between;padding:0 4vw 0 2vw}
.points{color:#e8bb3f}
.qr{position:absolute;right:4vw;bottom:4vh;width:8vw;height:8vw;background:white;color:black;border-radius:1vw;display:flex;align-items:center;justify-content:center;font-size:2vw;font-weight:900}
.qr.full{position:fixed;inset:0;width:100vw;height:100vh;border-radius:0;z-index:20;font-size:8vw}
.bigX{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;font-size:18vw;color:red;font-weight:900;text-shadow:0 0 60px red}
</style>
</head>
<body>

<div class="stage">
<div class="logo">AH</div>
<div class="roundScore" id="roundScore">0</div>
<div class="timer" id="timer">10 ث</div>

<div class="team left">
<div class="teamName" id="teamA">عائلة أ</div>
<div class="teamPoints" id="scoreA">0</div>
<div class="players">اللاعبون: <span id="playersA">0</span></div>
<div class="current" id="currentA">اللاعب الحالي</div>
<div class="wrongs" id="wrongA"></div>
</div>

<div class="team right">
<div class="teamName" id="teamB">عائلة ب</div>
<div class="teamPoints" id="scoreB">0</div>
<div class="players">اللاعبون: <span id="playersB">0</span></div>
<div class="current" id="currentB">اللاعب الحالي</div>
<div class="wrongs" id="wrongB"></div>
</div>

<div class="board" id="board"></div>

<div class="qr" onclick="this.classList.toggle('full')">QR</div>
<div class="bigX" id="bigX">X</div>
</div>

<script>
function render(){
const state=JSON.parse(localStorage.getItem("ff_tv_state")||"{}");

teamA.innerText=state.room?.team1 || "عائلة أ";
teamB.innerText=state.room?.team2 || "عائلة ب";
scoreA.innerText=state.scoreA || 0;
scoreB.innerText=state.scoreB || 0;
roundScore.innerText=state.roundPoints || 0;
timer.innerText=(state.timer || state.room?.timer || 10)+" ث";

wrongA.innerText="❌".repeat(state.wrongA||0);
wrongB.innerText="❌".repeat(state.wrongB||0);

let html="";
for(let i=0;i<6;i++){
const a=state.answers?.[i];
if(a && a.revealed){
html+=`<div class="answer revealed"><span>${a.text}</span><span class="points">${a.points}</span></div>`;
}else{
html+=`<div class="answer"><span class="num">${i+1}</span>•••••</div>`;
}
}
board.innerHTML=html;
}

setInterval(render,300);
render();
</script>

</body>
</html>
