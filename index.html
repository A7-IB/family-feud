<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Feud Arabia</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
text-align:center;
}

.logo{
font-size:42px;
font-weight:bold;
margin-bottom:15px;
}

.subtitle{
font-size:18px;
opacity:.85;
margin-bottom:40px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border-radius:24px;
padding:25px;
border:1px solid rgba(255,255,255,.15);
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:14px;
font-size:18px;
font-weight:bold;
margin-top:12px;
cursor:pointer;
}

.btn-primary{
background:#f59e0b;
color:white;
}

.btn-secondary{
background:#2563eb;
color:white;
}

.version{
margin-top:25px;
font-size:12px;
opacity:.6;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🎯 Family Feud</div>

<div class="subtitle">
نسخة التطوير الأولى
</div>

<div class="card">

<button class="btn btn-primary"
onclick="alert('سنبني شاشة إنشاء اللعبة هنا')">
إنشاء لعبة جديدة
</button>

<button class="btn btn-secondary"
onclick="alert('سنبني شاشة دخول اللاعبين هنا')">
دخول لاعب
</button>

</div>

<div class="version">
Version 1.0
</div>

</div>

</body>
</html>
