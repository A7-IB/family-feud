<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Feud Arabia</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
text-align:center;
}

.logo{
font-size:42px;
font-weight:bold;
margin-bottom:15px;
}

.subtitle{
font-size:18px;
opacity:.85;
margin-bottom:30px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border-radius:24px;
padding:25px;
border:1px solid rgba(255,255,255,.15);
}

input{
width:100%;
padding:16px;
border:none;
border-radius:14px;
font-size:17px;
margin-top:12px;
outline:none;
text-align:center;
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:14px;
font-size:18px;
font-weight:bold;
margin-top:12px;
cursor:pointer;
}

.btn-primary{
background:#f59e0b;
color:white;
}

.btn-secondary{
background:#2563eb;
color:white;
}

.error{
color:#fecaca;
margin-top:12px;
font-size:14px;
display:none;
}

.version{
margin-top:25px;
font-size:12px;
opacity:.6;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div class="container">

<div id="loginPage">
<div class="logo">🔐 Login</div>
<div class="subtitle">تسجيل الدخول للعبة</div>

<div class="card">
<input id="username" type="text" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button class="btn btn-primary" onclick="login()">
دخول
</button>

<div id="errorMsg" class="error">
اسم المستخدم أو كلمة المرور غير صحيحة
</div>
</div>

<div class="version">Family Feud - Secure Test</div>
</div>

<div id="homePage" class="hidden">
<div class="logo">Family Feud 🎯</div>

<div class="subtitle">
نسخة التطوير الأولى
</div>

<div class="card">

<button class="btn btn-primary"
onclick="alert('سنبني شاشة إنشاء اللعبة هنا')">
إنشاء لعبة جديدة
</button>

<button class="btn btn-secondary"
onclick="alert('سنبني شاشة دخول اللاعبين هنا')">
دخول لاعب
</button>

</div>

<div class="version">
Version 1.0
</div>
</div>

</div>

<script>
function login(){
const user=document.getElementById("username").value.trim().toLowerCase();
const pass=document.getElementById("password").value;

if(user==="a7_ib" && pass==="Admin@123"){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("homePage").classList.remove("hidden");
}else{
document.getElementById("errorMsg").style.display="block";
}
}
</script>

</body>
</html>
